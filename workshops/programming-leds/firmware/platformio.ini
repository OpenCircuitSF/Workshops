; ProgrammingLEDs -- ESP32-C3 lighting up 10 WS2812B LEDs for an intro class.
; No WiFi, no MQTT, no OTA: one environment, USB flash and serial monitor.
;
;   pio run                  build
;   pio run -t upload        flash over USB
;   pio device monitor       serial log

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_ARCH_ESP32=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    FastLED

[platformio]
default_envs = esp32c3
